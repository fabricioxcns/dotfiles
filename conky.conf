-- Conky estilo Dracula para Linux Mint MATE
conky.config = {
    -- Posição na tela
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 300,
    maximum_width = 300,

    -- Janela: fica "colada" no papel de parede, atrás de tudo
    background = true,
    double_buffer = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Fundo escuro semitransparente (precisa do compositor ativo)
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 170,
    own_window_colour = '282A36',
    border_inner_margin = 15,

    -- Texto
    use_xft = true,
    font = 'JetBrains Mono:size=10',
    draw_shades = false,
    default_bar_height = 6,

    -- Paleta Dracula
    default_color = 'F8F8F2', -- texto
    color1 = 'BD93F9',        -- roxo
    color2 = 'FF79C6',        -- rosa
    color3 = '50FA7B',        -- verde
    color4 = '6272A4',        -- cinza
    color5 = '8BE9FD',        -- ciano

    -- Atualização
    update_interval = 1,
    cpu_avg_samples = 2,
};

conky.text = [[
${color1}${font JetBrains Mono:bold:size=16}${exec whoami}@${nodename}${font}
${color4}${exec lsb_release -ds} · kernel ${kernel}
${color4}ligado há ${uptime}

${color2}${font JetBrains Mono:bold:size=11}SISTEMA${font}${color4} ${hr 1}
${color}CPU  ${alignr}${color3}${cpu cpu0}%
${color1}${cpubar cpu0}
${color}RAM  ${alignr}${color3}${mem} / ${memmax}
${color1}${membar}
${color}Disco${alignr}${color3}${fs_used /} / ${fs_size /}
${color1}${fs_bar /}

${color2}${font JetBrains Mono:bold:size=11}PROCESSOS${font}${color4} ${hr 1}
${color}${top name 1}${alignr}${color5}${top cpu 1}%
${color}${top name 2}${alignr}${color5}${top cpu 2}%
${color}${top name 3}${alignr}${color5}${top cpu 3}%
${if_match "${execi 2 playerctl -p spotify status 2>/dev/null}" == "Playing"}
${color2}${font JetBrains Mono:bold:size=11}TOCANDO AGORA${font}${color4} ${hr 1}
${color3}♫ ${color}${execi 2 playerctl -p spotify metadata --format '{{ title }}' 2>/dev/null}
${color4}  ${execi 2 playerctl -p spotify metadata --format '{{ artist }}' 2>/dev/null}
${else}${if_match "${execi 2 playerctl -p spotify status 2>/dev/null}" == "Paused"}
${color2}${font JetBrains Mono:bold:size=11}SPOTIFY${font}${color4} ${hr 1}
${color4}⏸ pausado
${endif}${endif}
]]
